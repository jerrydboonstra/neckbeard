<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 236" width="480" height="236"
     role="img" aria-label="Two profiles facing each other: one with a ponytail, one with a neckbeard reading a document.">
  <title>neckbeard</title>
  <defs>
    <pattern id="nb-dots-warm" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.5" fill="#D9913C"/>
    </pattern>
    <pattern id="nb-dots-cool" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.5" fill="#7E8C99"/>
    </pattern>
  </defs>

  <!-- ============ LEFT: ponytail. Ships it. Faces right. ============ -->
  <g stroke="#7E8C99" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ponytail, swept back and down -->
    <path d="M108 72 C 74 66, 44 92, 40 132 C 38 154, 50 166, 62 168"
          stroke-width="7" fill="url(#nb-dots-cool)" fill-opacity="0.55"/>
    <!-- hair band -->
    <path d="M104 64 L 116 84" stroke-width="7"/>
    <!-- head -->
    <circle cx="150" cy="100" r="50" fill="none"/>
    <!-- nose, pointing right -->
    <path d="M199 91 L 216 103 L 199 115" fill="none"/>
    <!-- mouth -->
    <path d="M186 124 L 172 128"/>
    <!-- neck and shoulders -->
    <path d="M150 150 L 150 172"/>
    <path d="M62 238 C 68 196, 104 178, 150 178 C 196 178, 232 196, 238 238"/>
  </g>

  <!-- ============ RIGHT: neckbeard. Reads it first. Faces left. ============ -->
  <g stroke="#D9913C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="330" cy="100" r="50" fill="none"/>
    <!-- nose, pointing left -->
    <path d="M281 92 L 266 103 L 281 114" fill="none"/>
    <!-- glasses: the lens on the visible side, and the arm going back -->
    <circle cx="300" cy="94" r="11" stroke-width="4.5"/>
    <path d="M311 92 L 330 90" stroke-width="4"/>
    <!-- THE neckbeard: hangs off the jaw, down the neck, wider at the bottom -->
    <path d="M296 133 C 292 160, 302 186, 330 190 C 358 186, 368 160, 364 133"
          stroke-width="6" fill="url(#nb-dots-warm)" fill-opacity="0.6"/>
    <!-- jaw line tucked under the beard -->
    <path d="M300 138 C 312 150, 348 150, 360 138" stroke-width="4" stroke-opacity="0.55"/>
    <!-- shoulders -->
    <path d="M242 238 C 248 208, 286 194, 330 194 C 374 194, 412 208, 418 238"/>
  </g>

  <!-- ============ the document being read, held between them ============ -->
  <g transform="rotate(-8 236 150)">
    <rect x="208" y="112" width="56" height="74" rx="4"
          fill="#FFFFFF" fill-opacity="0.08" stroke="#D9913C" stroke-width="4.5"/>
    <g stroke="#D9913C" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85">
      <path d="M220 130 H 252"/>
      <path d="M220 142 H 252"/>
      <path d="M220 154 H 244"/>
      <path d="M220 166 H 252"/>
    </g>
  </g>
</svg>
